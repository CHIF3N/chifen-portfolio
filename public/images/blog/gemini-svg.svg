<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1524" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a3ff" />
    </linearGradient>

    <linearGradient id="redBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="greenBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle Radial Light Spots -->
  <circle cx="150" cy="120" r="280" fill="#00f0ff" opacity="0.04" filter="url(#glowCyan)"/>
  <circle cx="1050" cy="500" r="320" fill="#10b981" opacity="0.03" filter="url(#glowCyan)"/>
  <circle cx="950" cy="200" r="250" fill="#ef4444" opacity="0.05" filter="url(#glowRed)"/>

  <!-- Left: Main Title & Typography -->
  <g transform="translate(80, 110)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="185" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="1.5">GOOGLE APPS SCRIPT</text>

    <!-- Main Headline -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Bypassing
    </text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f87171" letter-spacing="-0.5">
      "This App Is Blocked"
    </text>

    <!-- Subtitle -->
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" width="460">
      Fixing Google OAuth Scope Locks When Deploying
    </text>
    <text x="0" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Web Apps &amp; Manifest Restrictons
    </text>

    <!-- Meta Tech Pills -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="145" height="34" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2"/>
      <text x="14" y="22" font-family="Courier, monospace" font-size="13" font-weight="700" fill="#00f0ff">@OnlyCurrentDoc</text>

      <rect x="160" y="0" width="165" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="174" y="22" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#cbd5e1">appsscript.json</text>

      <rect x="340" y="0" width="110" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="354" y="22" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#cbd5e1">OAuth 2.0</text>
    </g>
  </g>

  <!-- Right: Code Terminal & Graphic Badges -->
  <g transform="translate(630, 95)">
    <!-- Terminal Window Frame -->
    <rect x="0" y="0" width="490" height="390" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5"/>
    
    <!-- Top Terminal Titlebar -->
    <path d="M 0 12 Q 0 0 12 0 L 478 0 Q 490 0 490 12 L 490 42 L 0 42 Z" fill="#0a101d"/>
    <line x1="0" y1="42" x2="490" y2="42" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window controls -->
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="210" y="26" font-family="Courier, monospace" font-size="12" fill="#64748b" text-anchor="middle">appsscript.json</text>

    <!-- Code Block Inside Terminal -->
    <g transform="translate(24, 66)" font-family="Courier, monospace" font-size="12.5" line-height="1.6">
      <text y="0" fill="#94a3b8">{</text>
      <text y="24" fill="#94a3b8">  <tspan fill="#38bdf8">"timeZone"</tspan>: <tspan fill="#fde047">"Africa/Lagos"</tspan>,</text>
      <text y="48" fill="#94a3b8">  <tspan fill="#38bdf8">"runtimeVersion"</tspan>: <tspan fill="#fde047">"V8"</tspan>,</text>
      <text y="72" fill="#94a3b8">  <tspan fill="#38bdf8">"webapp"</tspan>: {</text>
      <text y="96" fill="#94a3b8">    <tspan fill="#38bdf8">"access"</tspan>: <tspan fill="#fde047">"MYSELF"</tspan></text>
      <text y="120" fill="#94a3b8">  },</text>
      
      <!-- Highlighted Scope Segment -->
      <rect x="-6" y="134" width="454" height="52" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.3"/>
      <text y="152" fill="#94a3b8">  <tspan fill="#38bdf8">"oauthScopes"</tspan>: [</text>
      <text y="174" fill="#00ff9f" font-weight="700">    "spreadsheets.currentonly"</text>
      <text y="196" fill="#94a3b8">  ]</text>
      <text y="220" fill="#94a3b8">}</text>
    </g>

    <!-- Floating Error / Fixed Overlays -->
    <!-- Red Error Badge -->
    <g transform="translate(-40, 240)" filter="url(#glowRed)">
      <rect width="190" height="58" rx="8" fill="#1e1215" stroke="#ef4444" stroke-width="1.5"/>
      <polygon points="26,38 38,16 50,38" fill="#ef4444"/>
      <text x="38" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">!</text>
      <text x="64" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">OAUTH ERROR</text>
      <text x="64" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">App Blocked</text>
    </g>

    <!-- Arrow Transition -->
    <g transform="translate(170, 260)">
      <path d="M 0 5 L 28 5 M 20 -2 L 28 5 L 20 12" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Green Success Badge -->
    <g transform="translate(220, 240)">
      <rect width="190" height="58" rx="8" fill="#0c1e19" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="38" cy="29" r="14" fill="#10b981"/>
      <path d="M 32 29 L 36 33 L 45 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">STATUS: RESOLVED</text>
      <text x="64" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Access Granted</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#cyanGlow)"/>
</svg>
