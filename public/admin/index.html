<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager | chifen.is-a.dev</title>

    <!-- Netlify Identity Widget — authentication handshake -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      /* Dark palette matching the site */
      :root {
        --bg: #0a0a0f;
        --surface: #12121a;
        --border: #1e1e2e;
        --accent: #7c6af7;
        --text: #e2e2ef;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        min-height: 100vh;
      }

      /* Loading state shown before CMS mounts */
      #cms-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1rem;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      #cms-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-label {
        font-size: 0.875rem;
        color: #6e6e8a;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Shown while Decap CMS boots -->
    <div id="cms-loading" aria-live="polite" aria-label="Loading CMS">
      <div class="spinner"></div>
      <span class="loading-label">Loading CMS&hellip;</span>
    </div>

    <!-- Decap CMS mounts here -->
    <script>
      // Hide spinner once CMS has mounted
      window.addEventListener('load', () => {
        const el = document.getElementById('cms-loading');
        if (el) {
          setTimeout(() => el.classList.add('hidden'), 800);
        }
      });
    </script>

    <!-- Decap CMS via unpkg CDN -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
